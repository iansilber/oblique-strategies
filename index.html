  orbit.vYaw = orbit.vPitch = 0;
});
cv.addEventListener("pointermove", (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) { cv.classList.toggle("hot", open || boxHit(e)); return; }
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  prev.x = e.clientX; prev.y = e.clientY;
  dragged += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()], dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (pinch) setZoom(pinch / dist);
    pinch = dist; frame(); return;
  }
  if (dragged > 6 && open && !dir) {
    cv.classList.add("drag");
    spin.vx = dx * 0.01; spin.vy = dy * 0.01; turnCard(spin.vx, spin.vy); pose(time);
  } else if (dragged > 6) {
    cv.classList.add("drag");
    orbit.vYaw = -dx * 0.006; orbit.vPitch = dy * 0.005;
    orbit.yaw += orbit.vYaw; setPitch(orbit.pitch + orbit.vPitch); frame();
  }
});
function release(e) {
  pointers.delete(e.pointerId); pinch = 0;
  if (!pointers.size) cv.classList.remove("drag");
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", (e) => { release(e); dragged = 99; });
cv.addEventListener("wheel", (e) => { e.preventDefault(); setZoom(Math.exp(e.deltaY * 0.001)); frame(); }, { passive: false });
cv.addEventListener("click", (e) => {
  if (dragged > 6) return;
  if (open && info && !dir && swap.target === 0) { swap.target = 1; play("card-back"); return; }  // tuck the title card behind
  if (open || boxHit(e)) toggle();
});
cv.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); return; }
  const step = { ArrowLeft: [0.15, 0], ArrowRight: [-0.15, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
  if (step) { e.preventDefault(); orbit.yaw += step[0]; setPitch(orbit.pitch + step[1]); frame(); }
});
addEventListener("resize", layout);

layout();
renderer.setAnimationLoop((nowMs) => {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  if (!pointers.size && (Math.abs(orbit.vYaw) > 1e-4 || Math.abs(orbit.vPitch) > 1e-4)) {
    orbit.yaw += orbit.vYaw; setPitch(orbit.pitch + orbit.vPitch);
    orbit.vYaw *= 0.92; orbit.vPitch *= 0.92;
    if (!dir) frame();
  }
  if (!pointers.size && (Math.abs(spin.vx) > 1e-4 || Math.abs(spin.vy) > 1e-4)) {
    turnCard(spin.vx, spin.vy); spin.vx *= 0.93; spin.vy *= 0.93;
    if (!dir) pose(time);
  }
  if (swap.t !== swap.target) {
    swap.t = swap.target > swap.t ? Math.min(swap.target, swap.t + dt / 0.75) : Math.max(swap.target, swap.t - dt / 0.75);
    if (!dir) pose(time);
  }
  if (dir) {
    const prev = time;
    time = Math.min(END, Math.max(0, time + dir * dt * speed * (dir < 0 ? 1.4 : 1)));
    for (const c of CUES) if (c.dir === dir && (dir > 0 ? prev <= c.t && time > c.t : prev >= c.t && time < c.t)) play(c.s);
    pose(time);
    if (time === END || time === 0) {
      dir = 0;
      if (time === 0) { spin.q.identity(); orbit.card = 1; swap.t = swap.target = 0; frame(); if (pendingInfo) { pendingInfo = false; toggle("info"); } }
    }
  }
  renderer.clear();
  renderer.render(scene, camera);
  if (card.parent === cardScene) {
    cardKey.position.copy(KEY_OFFSET).applyQuaternion(camera.quaternion).add(camera.position);
    cardKey.target.position.copy(camera.position).add(camera.getWorldDirection(v).multiplyScalar(30));
    renderer.render(dimScene, flatCam);
    renderer.clearDepth();
    renderer.render(cardScene, camera);
  }
});
</script>
